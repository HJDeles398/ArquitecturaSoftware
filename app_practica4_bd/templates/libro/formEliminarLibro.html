{% extends "base.html" %}

{% block titulo %}Eliminar Libro{% endblock %}

{% block contenido %}
  <h2>¿Estás seguro de que deseas eliminar el libro "{{ libro.titulo }}"?</h2>
  <form method="post">
    {% csrf_token %}
    <button type="submit" style="color: red;">Sí, eliminar</button>
    <a href="{% url 'detalleLibroPagina' libro.id %}">Cancelar</a>
  </form>
{% endblock %}
