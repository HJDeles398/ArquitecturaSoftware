{% extends "base.html" %}

{% block titulo %}Editar Libro{% endblock %}

{% block contenido %}
  <h2>{{ titulo }}</h2>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Actualizar">
    <a href="{% url 'detalleLibroPagina' form.instance.id %}">Cancelar</a>
  </form>
{% endblock %}
