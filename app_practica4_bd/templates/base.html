<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{% load static %}
<link rel="stylesheet" href="{% static 'css/styles.css' %}">
<title>{% block titulo %}Mi Sitio{% endblock %}</title>
</head>
<body>
<header>
<h1>Biblioteca Web</h1>
{% if messages %}
  <ul class="messages">
    {% for message in messages %}
      <li class="{{ message.tags }}">{{ message }}</li>
    {% endfor %}
  </ul>
{% endif %}
<nav>
<a href="{% url 'inicio' %}">Inicio</a>
<a href="{% url 'paginaBiblioteca' %}">Biblioteca</a>
<a href="{% url 'paginaLibro' %}">Libro</a>
<a href="{% url 'paginaUsuario' %}">Usuario</a>
<a href="{% url 'paginaPrestamo' %}">Prestamo</a>
</nav>
</header>
<main>
{% block contenido %}{% endblock %}
</main>
<footer>
<p>&copy; 2025 Biblioteca Web</p>
</footer>
</body>
</html>
